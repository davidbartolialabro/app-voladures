<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inclinació i Pedra</title>

  <link rel="stylesheet" href="style.css">
</head>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111111">
<body>

  <div class="container">

    <h1>INCLINACIÓ I PEDRA</h1>

    <section>
    <h2>PARÀMETRES TIPUS</h2>

    <label>Longitud perforació tipus (m)</label>
    <input type="number" id="lperfTipus" value="21" step="0.1">

    <label>Inclinació tipus (°)</label>
    <input type="number" id="inclTipus" value="18" step="0.1">

    <div class="parametreCalculat">
    Alçada barrinada: <span id="alcada">0</span> m
    </div>
   </section>
    <section>
   <h2>FILES</h2>

   <div id="filesContainer"></div>

  <button id="addFila">➕ Afegir fila</button>
  </section>
  </div>

  <script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</body>
</html>
